version: v7-mma
name: dual-physics-mma
mesh:
  backend: theta_mesh
  theta_config_path: ${HOME}/Optimization_Framework/modules/theta_mesh/config/base_config.yaml
  output_dir: ${HOME}/koa_scratch/dual_physics_meshes
  theta_overrides:
    geometry:
      inner_radius_r_mm: 13.25
      inner_radius_z_mm: 34.0
      hole_radius_mm: 2.0
      hole_fillet_factor: 0.5
    mesh:
      target_element_size_mm: 3.0
      interface_mesh_size_mm: 1.5
      core_element_size_mm: 8.0
      mesh_algorithm: 10
      theta_band_edges_deg:
      - 0
      - 9
      - 18
      - 27
      - 36
      - 45
      - 54
      - 63
      - 72
      - 81
      - 90
    fracture_design:
      fracture_planes_phi_deg:
      - 90
      - 270
      zone_width_deg: 10.0
      fracture_factor_theta:
      - 0.3
      - 0.3
      - 0.3
      - 0.3
      - 0.3
      - 0.3
      - 0.3
      - 0.3
      - 0.3
      - 0.3
      min_fracture_thickness_mm: 0.5
    output:
      export_peridigm: true
    peridigm_export:
      uniform_spacing_mm: 0.5
      steel_spacing_mm: 1.25
      pla_hole_radius_mm: 5.0
fea:
  backend: truth_contact
  mode: local
  simulation_mode: transient
  use_worst_case_stress: true
  parallel_orientations: true
  n_parallel_workers: 7
  time_end_s: 0.005
  timestep_s: 2.0e-05
  time_integration: newmark
  newmark_beta: 0.25
  newmark_gamma: 0.5
  damping_ratio: 0.03
  drop_mass_kg: 0.045
  drop_height_m: 1.275
  contact_penalty: 1.0e9
  contact_model: penalty
  cone_axial_band_mm: 1.5
  cone_radial_band_mm: 1.0
  newton_max_it: 40
  newton_relax: 1.0
  stress_limit_Pa: 44.0e6
  output_format: vtk
  output_interval: 25
  write_bc_markers: false
  save_outputs: true
peridigm:
  backend: real
  mode: hpc
  enabled: true
  flyback_mode: true
  impact_velocity: 50.0
  simulation_time_s: 0.0008
  steel_gap_m: 0.003
  split_axis: x
  cone_enable: true
  cone_half_angle_deg: 10
  cone_height_m: 0.03
  cone_cylinder_radius_m: 0.004
  cone_tip_radius_m: 0.0
  cone_axis: -z
  cone_mass_kg: 0.125
  cone_initial_velocity: true
  rigid_cone: true
  cone_no_damage: true
  particle_spacing_mm: 0.5
  horizon_mm: 2.25
  pla_critical_stretch: 0.022
  pla_wave_speed_mps: 1420.0
  cone_angle_adaptation:
    enabled: false
    min_angle_deg: 10
    max_angle_deg: 10
    step_deg: 0
    target_depth_min: 3
    target_depth_max: 6
    damage_threshold: 0.1
  fracture_damage_target: 0.8
  shell_damage_threshold: 0.2
  fracture_completeness_target: 0.4
  min_shell_integrity: 0.0
  hpc:
    partition: kill-shared
    nodes: 1
    ntasks: 8
    time_limit: 04:00:00
    timeout: 14400
material:
  min_thickness_mm: 1.2
  max_thickness_mm: 10.0
regions:
  fracture_zone_ids:
  - 3
  shell_body_ids:
  - 2
  steel_core_ids:
  - 1
optimization:
  n_theta_bands: 10
  initial_thickness_mm: 1.5
  use_spline_thickness: true
  enforce_monotone_thickness: true
  fixed_band_indices: []
  max_thickness_gradient_mm: 0
  gradient_lift_mode: false
  thickness_relaxation: 0.6
  target_safety_factor: 1.0
  thickness_resolution_mm: 0.02
  stress_thickness_exponent: 0.5
  safe_stress_threshold: 1.0
  use_momentum: false
  momentum_beta: 0.7
  direction_damping: 0.5
  use_secant_method: false
  use_adaptive_relaxation: false
  adaptive_relaxation_thresholds:
    far:
      error: 0.5
      relaxation: 0.9
    medium:
      error: 0.2
      relaxation: 0.6
    close:
      error: 0.0
      relaxation: 0.3
  use_fracture_bisection: true
  stress_band_stat: p95
  stress_band_percentile: 95
  max_iterations: 200
  thickness_tolerance: 0.05
  convergence_window: 3
  fitness_tolerance: 0.1
  require_stress_convergence: true
  dual_physics_weights:
    stress: 1.0
    fracture_miss: 1.0
    shell_damage: 0.0
    energy_absorption: 0.5
  target_energy_absorption_ratio: 0.7
  fracture_aware_cap: true
  hole_fillet:
    optimize: true
    min_factor: 0.0
    max_factor: 1.0
    relaxation: 0.3
  optimize_fracture_factor: true
  fracture_relaxation: 0.2
  target_D_fracture: 0.3
  max_D_shell: 0.1
  fracture_resolution: 0.1
  fracture_min_step_mm: 0.25
  initial_fracture_factor: 0.3
  min_fracture_factor: 0.1
  max_fracture_factor: 0.9
  min_fracture_thickness_mm: 0.5
  max_fracture_thickness_mm: 0.0
  use_per_band_damage: true
  target_band_fracture_damage: 0.3
  max_band_protected_damage: 0.5
  use_crack_line_metrics: true
  crack_line_slice_mm: 0.75
  crack_line_damage_threshold: 0.5
  fracture_score_threshold: 0.5
  fracture_continuity_threshold: 0.8
  frac_vol_breach_threshold: 0.5
  optimization_method: mma
  mma_asymptote_init: 0.2
  mma_oscillation_shrink: 0.7
  mma_monotone_expand: 1.2
output:
  dir: ${HOME}/koa_scratch/dual_physics_opt_${SLURM_JOB_ID:-local}
  save_every: 1
